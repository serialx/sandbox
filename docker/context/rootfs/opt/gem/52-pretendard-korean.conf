<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Korean generic sans-serif default -> Pretendard (AIO Sandbox).

  Why this is a separate, low-numbered file (and not folded into
  99-font-aliases.conf): 60-generic.conf makes the generic families fall
  back to one another, so a "serif:lang=ko" or "monospace:lang=ko" pattern
  gains "sans-serif" in its expanded family list. fontconfig's default
  family test is qual="any", so a sans-serif match running AFTER 60- (e.g.
  from 99-) would also fire for serif/monospace and wrongly map them to
  Pretendard (a sans face). Sorting at 52- runs the prepend BEFORE that
  cross-expansion, scoping it to sans-serif only.

  Noto Sans CJK KR stays in the fallback chain for glyphs Pretendard lacks
  (e.g. rarer Hanja). Named Korean sans fonts (Malgun Gothic, Apple SD
  Gothic Neo, Nanum Gothic, ...) are mapped to Pretendard in
  99-font-aliases.conf; Korean serif (Batang) stays on Noto Serif CJK KR.
-->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Pretendard</string></edit>
  </match>
</fontconfig>
